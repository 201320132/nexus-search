* {
  box-sizing: border-box;
}

:root {
  color-scheme: dark;
  --bg: #070b14;
  --bg-elevated: rgba(18, 24, 36, 0.82);
  --bg-soft: rgba(21, 28, 39, 0.9);
  --panel: rgba(14, 20, 30, 0.88);
  --panel-strong: rgba(18, 22, 34, 0.95);
  --border: rgba(148, 163, 184, 0.14);
  --text: #edf3ff;
  --muted: #9aa8bd;
  --muted-strong: #c7d2ea;
  --primary: #6ee7ff;
  --primary-strong: #58a6ff;
  --purple: #8b5cf6;
  --green: #34d399;
  --shadow: rgba(10, 13, 24, 0.55);
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Inter', sans-serif;
  background:
    radial-gradient(circle at top left, rgba(84, 111, 255, 0.28), transparent 36%),
    radial-gradient(circle at bottom right, rgba(41, 193, 255, 0.2), transparent 32%),
    var(--bg);
  color: var(--text);
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

#root {
  min-height: 100vh;
}

.app-shell {
  width: min(1420px, calc(100% - 32px));
  margin: 0 auto;
  padding: 24px 0 40px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 12px 18px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: rgba(10, 14, 22, 0.56);
  backdrop-filter: blur(18px);
  box-shadow: 0 18px 28px var(--shadow);
}

.brand-wrap {
  display: inline-flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  border: 1px solid rgba(110, 231, 255, 0.22);
  background: linear-gradient(135deg, rgba(110, 231, 255, 0.18), rgba(139, 92, 246, 0.18));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
}

.brand-mark img {
  width: 26px;
  height: 26px;
  display: block;
}

.brand-copy {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.brand-name {
  font-size: 1.2rem;
  font-weight: 800;
  letter-spacing: -0.05em;
}

.brand-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 3px 8px;
  border-radius: 999px;
  background: linear-gradient(135deg, rgba(110, 231, 255, 0.14), rgba(88, 166, 255, 0.18));
  border: 1px solid rgba(110, 231, 255, 0.2);
  font-size: 0.62rem;
  font-weight: 700;
  color: var(--primary);
}

.nav-links {
  display: inline-flex;
  align-items: center;
  gap: 20px;
  color: var(--muted);
  font-size: 0.92rem;
}

.nav-links a {
  transition: color 0.2s ease;
}

.nav-links a:hover {
  color: var(--text);
}

.top-actions {
  display: inline-flex;
  align-items: center;
  gap: 12px;
}

.primary-mini,
.secondary-mini,
.search-button,
.magic-toggle,
.chip,
.trend-pill {
  transition: all 0.2s ease;
}

.primary-mini,
.secondary-mini {
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: rgba(19, 26, 39, 0.9);
  color: var(--text);
}

.primary-mini {
  background: linear-gradient(135deg, rgba(108, 201, 255, 0.2), rgba(139, 92, 246, 0.2));
  border-color: rgba(110, 231, 255, 0.2);
}

.primary-mini:hover,
.secondary-mini:hover,
.search-button:hover,
.magic-toggle:hover,
.chip:hover,
.trend-pill:hover {
  transform: translateY(-1px);
}

.search-page {
  padding-top: 26px;
}

.search-board {
  padding: 22px 22px 18px;
  border: 1px solid var(--border);
  border-radius: 30px;
  background: rgba(12, 17, 25, 0.72);
  box-shadow: 0 22px 40px rgba(5, 8, 15, 0.46);
}

.search-line {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) 166px 140px;
  align-items: center;
  gap: 12px;
  padding: 12px 14px 12px 10px;
  background: rgba(17, 22, 30, 0.88);
  border: 1px solid rgba(148, 163, 184, 0.14);
  border-radius: 22px;
}

.search-icon {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  color: var(--muted);
}

.search-icon svg {
  width: 22px;
  height: 22px;
}

.search-line input {
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 1.05rem;
  outline: none;
}

.search-line input::placeholder {
  color: var(--muted);
}

.magic-toggle,
.search-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 48px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: rgba(18, 24, 33, 0.9);
  color: var(--text);
  font-weight: 600;
}

.magic-toggle {
  background: linear-gradient(135deg, rgba(110, 231, 255, 0.12), rgba(139, 92, 246, 0.12));
  border-color: rgba(110, 231, 255, 0.22);
}

.sparkle {
  color: var(--primary);
  font-size: 1.1rem;
}

.search-button {
  background: linear-gradient(135deg, #60a5fa, #8b5cf6 55%, #d946ef);
  border: none;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
}

.filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}

.chip {
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: rgba(18, 24, 32, 0.8);
  color: var(--muted-strong);
}

.chip.active {
  background: linear-gradient(135deg, rgba(96, 165, 250, 0.12), rgba(139, 92, 246, 0.12));
  border-color: rgba(96, 165, 250, 0.32);
  color: var(--text);
}

.suggestions-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 16px;
}

.trend-pill {
  padding: 9px 14px;
  border-radius: 999px;
  border: 1px solid rgba(148, 163, 184, 0.14);
  background: rgba(17, 22, 31, 0.82);
  color: var(--muted-strong);
}

.results-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(260px, 0.65fr);
  gap: 22px;
  margin-top: 24px;
}

.results-column,
.sidebar-column {
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.card-surface {
  background: rgba(14, 19, 28, 0.82);
  border: 1px solid var(--border);
  border-radius: 22px;
  box-shadow: 0 20px 36px rgba(1, 5, 12, 0.32);
}

.ai-overview {
  padding: 22px 22px 18px;
}

.section-kicker {
  display: inline-flex;
  padding: 7px 10px;
  border-radius: 999px;
  border: 1px solid rgba(110, 231, 255, 0.22);
  background: rgba(110, 231, 255, 0.08);
  color: var(--primary);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
}

.ai-overview h2 {
  margin: 16px 0 12px;
  font-size: clamp(1.5rem, 2vw, 2.3rem);
  letter-spacing: -0.06em;
}

.ai-overview p {
  margin: 0;
  color: var(--muted-strong);
  line-height: 1.7;
  max-width: 70ch;
}

.fact-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-top: 20px;
}

.fact-box {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 14px 14px 16px;
  border: 1px solid rgba(148, 163, 184, 0.08);
  border-radius: 16px;
  background: rgba(17, 24, 34, 0.82);
}

.fact-box span {
  color: var(--muted);
  font-size: 0.76rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.fact-box strong {
  font-size: 0.98rem;
  line-height: 1.5;
}

.results-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: var(--muted-strong);
  font-weight: 600;
  padding: 0 2px;
}

.meta-status {
  color: var(--muted);
  font-weight: 500;
  font-size: 0.82rem;
}

.result-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.result-item {
  padding: 18px 18px 16px;
}

.result-url-row {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.result-type {
  display: inline-flex;
  padding: 6px 8px;
  border-radius: 999px;
  background: rgba(16, 185, 129, 0.12);
  border: 1px solid rgba(52, 211, 153, 0.2);
  color: var(--green);
}

.result-item h3 {
  margin: 12px 0 8px;
  font-size: clamp(1.2rem, 2vw, 1.6rem);
  letter-spacing: -0.04em;
}

.result-item p {
  margin: 0;
  color: var(--muted-strong);
  line-height: 1.7;
}

.result-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 18px;
  margin-top: 14px;
  color: var(--muted);
  font-size: 0.8rem;
}

.mini-panel {
  padding: 18px 18px 16px;
}

.mini-panel h3 {
  margin: 16px 0 14px;
  font-size: 1.3rem;
  letter-spacing: -0.05em;
}

.stat-stack {
  display: grid;
  gap: 12px;
}

.stat-stack div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 12px 12px;
  border-radius: 12px;
  background: rgba(16, 23, 32, 0.76);
  border: 1px solid rgba(148, 163, 184, 0.08);
}

.stat-stack span {
  color: var(--muted);
}

.stat-stack strong {
  color: var(--text);
  font-size: 1.1rem;
}

.faq-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 12px;
}

.faq-list li {
  padding: 12px 12px;
  border-radius: 12px;
  background: rgba(16, 23, 32, 0.76);
  border: 1px solid rgba(148, 163, 184, 0.08);
  color: var(--muted-strong);
  line-height: 1.6;
}

@media (max-width: 980px) {
  .topbar {
    flex-wrap: wrap;
    justify-content: center;
  }

  .results-layout {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 700px) {
  .app-shell {
    width: min(100% - 20px, 1420px);
    padding-top: 14px;
  }

  .nav-links,
  .top-actions {
    width: 100%;
    justify-content: center;
  }

  .search-line {
    grid-template-columns: 42px minmax(0, 1fr);
    padding-right: 12px;
  }

  .search-button,
  .magic-toggle {
    height: 44px;
  }

  .search-button {
    grid-column: span 2;
  }

  .fact-grid {
    grid-template-columns: 1fr;
  }
}
